app = "bazaar-agentic"
primary_region = "sin"

[build]

[env]
  PORT = "8000"
  BAZAAR_LLM = "fake"
  BAZAAR_RAZORPAY = "fake"
  BAZAAR_ENV = "prod"   # boot refuses the dev admin token / webhook secret: set them with `flyctl secrets set`

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
